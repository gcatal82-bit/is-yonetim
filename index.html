<!DOCTYPE html>
<html>
<head>
  <title>İş Yönetim</title>
</head>
<body style="font-family: Arial; padding: 40px; text-align: center; background: #f0f0f0;">
  <h1>📊 İş Yönetim Sistemi</h1>
  <p>Hoşgeldiniz!</p>
  
  <div style="background: white; padding: 20px; border-radius: 8px; max-width: 300px; margin: 0 auto;">
    <input type="email" placeholder="Email" id="email" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd;">
    <input type="password" placeholder="Şifre" id="password" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd;">
    <button onclick="alert('Email: ' + document.getElementById('email').value)" style="width: 100%; padding: 10px; background: #1e40af; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 10px 0;">Giriş Yap</button>
    <button onclick="alert('Hesap Oluşturuluyor!')" style="width: 100%; padding: 10px; background: #059669; color: white; border: none; border-radius: 4px; cursor: pointer;">Hesap Oluştur</button>
  </div>
</body>
</html>

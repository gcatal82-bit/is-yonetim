<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 İş Yönetim - Google Drive</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding-bottom: 80px; }
    .header { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); color: white; padding: 20px; text-align: center; position: sticky; top: 0; z-index: 20; }
    .header h1 { font-size: 28px; margin-bottom: 5px; }
    .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; background: white; border-bottom: 2px solid #e5e7eb; position: sticky; top: 70px; z-index: 15; }
    .tab { padding: 15px; text-align: center; cursor: pointer; font-size: 24px; }
    .tab.active { background: #1e40af; color: white; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .stat { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #1e40af; text-align: center; }
    .stat-val { font-size: 20px; font-weight: bold; color: #1e40af; }
    .btn-add { width: 100%; padding: 12px; background: #1e40af; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 15px; font-weight: 600; }
    .form { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; }
    .form button { width: 100%; padding: 10px; background: #1e40af; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    .item { background: white; padding: 12px; margin: 10px 0; border-radius: 6px; border-left: 4px solid #0ea5e9; position: relative; }
    .item-del { position: absolute; top: 10px; right: 10px; background: #dc2626; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; }
    .logout-btn { width: 100%; padding: 12px; background: #dc2626; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    .login-box { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 12px; }
    .login-input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
    .login-btn { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin: 10px 0; font-weight: 600; }
    .btn-primary { background: #1e40af; color: white; }
    .btn-success { background: #059669; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const CLIENT_ID = '8261571739-hf3ptbkhbik4ak5cumops.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.profile';
    
    let users = JSON.parse(localStorage.getItem('users')) || {};
    let current = localStorage.getItem('current');
    let tab = 'dash';
    let gapi_loaded = false;

    window.onload = () => {
      gapi.load('client:auth2', init_gapi);
    };

    function init_gapi() {
      gapi.client.init({
        clientId: CLIENT_ID,
        scope: SCOPES
      }).then(() => {
        gapi_loaded = true;
        show();
      }).catch(e => {
        console.log('GAPI Error:', e);
        show();
      });
    }

    function getData() {
      return JSON.parse(localStorage.getItem('app_' + current)) || { mus: {}, sat: {}, gid: {} };
    }

    function save(d) {
      localStorage.setItem('app_' + current, JSON.stringify(d));
      if(gapi_loaded) save_to_drive(d);
      show();
    }

    function save_to_drive(d) {
      const user = users[current];
      const content = new Blob([JSON.stringify(d)], { type: 'application/json' });
      const metadata = {
        name: current + '_data.json',
        mimeType: 'application/json'
      };
      const form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', content);

      fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + gapi.auth2.getAuthInstance().currentUser.get().getAuthResponse().id_token
        },
        body: form
      }).catch(e => console.log('Drive save error:', e));
    }

    function showLogin() {
      document.getElementById('app').innerHTML = `
        <div class="login-box">
          <h1 style="text-align: center; color: #1e40af; margin-bottom: 20px;">📊 İş Yönetim</h1>
          <div id="login">
            <h2>Giriş Yap</h2>
            <input type="email" id="em" placeholder="Email" class="login-input">
            <input type="password" id="pw" placeholder="Şifre" class="login-input">
            <button onclick="login()" class="login-btn btn-primary">Giriş Yap</button>
            <button onclick="tog()" class="login-btn btn-success" style="margin-top: 10px;">Hesap Oluştur</button>
          </div>
          <div id="signup" class="hidden">
            <h2>Hesap Oluştur</h2>
            <input type="text" id="nm" placeholder="Adınız" class="login-input">
            <input type="email" id="se" placeholder="Email" class="login-input">
            <input type="password" id="sp" placeholder="Şifre" class="login-input">
            <button onclick="signup()" class="login-btn btn-success">Oluştur</button>
            <button onclick="tog()" class="login-btn" style="background: #666; color: white;">Geri</button>
          </div>
        </div>
      `;
    }

    function tog() {
      document.getElementById('login').classList.toggle('hidden');
      document.getElementById('signup').classList.toggle('hidden');
    }

    function login() {
      let e = document.getElementById('em').value;
      let p = document.getElementById('pw').value;
      if(users[e] && users[e].pw === p) {
        localStorage.setItem('current', e);
        current = e;
        show();
      } else alert('Hatalı!');
    }

    function signup() {
      let n = document.getElementById('nm').value;
      let e = document.getElementById('se').value;
      let p = document.getElementById('sp').value;
      if(!n || !e || !p) { alert('Doldurun'); return; }
      if(users[e]) { alert('Var'); return; }
      users[e] = { nm: n, pw: p };
      localStorage.setItem('users', JSON.stringify(users));
      alert('Oldu!');
      tog();
    }

    function addMus() {
      let isim = document.getElementById('misim').value;
      let soy = document.getElementById('msoy').value;
      if(!isim || !soy) { alert('Doldur'); return; }
      let d = getData();
      d.mus['m' + Date.now()] = { isim, soy, tel: document.getElementById('mtel').value, shr: document.getElementById('mshr').value };
      save(d);
      document.getElementById('misim').value = '';
      document.getElementById('msoy').value = '';
    }

    function addSat() {
      let mus = document.getElementById('smus').value;
      if(!mus) { alert('Müşteri'); return; }
      let d = getData();
      d.sat['s' + Date.now()] = { mus, sat: parseFloat(document.getElementById('ssat').value) || 0, sip: parseFloat(document.getElementById('ssip').value) || 0, tah: parseFloat(document.getElementById('stah').value) || 0 };
      save(d);
      document.getElementById('smus').value = '';
    }

    function addGid() {
      let kat = document.getElementById('gkat').value;
      let aç = document.getElementById('gaç').value;
      if(!kat || !aç) { alert('Doldur'); return; }
      let d = getData();
      d.gid['g' + Date.now()] = { kat, aç, tur: parseFloat(document.getElementById('gtur').value) || 0 };
      save(d);
      document.getElementById('gkat').value = '';
      document.getElementById('gaç').value = '';
    }

    function del(tip, id) {
      if(!confirm('Sil?')) return;
      let d = getData();
      delete d[tip][id];
      save(d);
    }

    function logout() {
      localStorage.removeItem('current');
      current = null;
      tab = 'dash';
      showLogin();
    }

    function show() {
      if(!current) { showLogin(); return; }
      let d = getData();
      let u = users[current];
      let m = Object.entries(d.mus);
      let s = Object.entries(d.sat);
      let g = Object.entries(d.gid);
      let tsat = s.reduce((a,b) => a + (b[1].sat || 0), 0);
      let tsip = s.reduce((a,b) => a + (b[1].sip || 0), 0);
      let ttah = s.reduce((a,b) => a + (b[1].tah || 0), 0);
      let tgid = g.reduce((a,b) => a + (b[1].tur || 0), 0);

      let h = `<div class="header"><h1>📊 İş Yönetim</h1><p>👤 ${u.nm}</p></div>`;
      h += `<div class="tabs"><div class="tab ${tab === 'dash' ? 'active' : ''}" onclick="tab='dash'; show();">📊</div><div class="tab ${tab === 'mus' ? 'active' : ''}" onclick="tab='mus'; show();">👥</div><div class="tab ${tab === 'sat' ? 'active' : ''}" onclick="tab='sat'; show();">📝</div><div class="tab ${tab === 'gid' ? 'active' : ''}" onclick="tab='gid'; show();">💰</div></div>`;
      h += `<div class="container">`;

      if(tab === 'dash') {
        h += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"><div class="stat"><div style="font-size:12px;">📦 Satılan</div><div class="stat-val">${tsat}</div></div><div class="stat"><div style="font-size:12px;">📋 Sipariş</div><div class="stat-val">${tsip}</div></div><div class="stat"><div style="font-size:12px;">💵 Tahsil</div><div class="stat-val">${ttah}</div></div><div class="stat"><div style="font-size:12px;">📊 Giderler</div><div class="stat-val">${tgid}</div></div></div>`;
      }

      if(tab === 'mus') {
        h += `<button class="btn-add" onclick="document.getElementById('fmus').classList.toggle('hidden');">➕ Müşteri Ekle</button><div id="fmus" class="form hidden"><input type="text" id="misim" placeholder="İsim"><input type="text" id="msoy" placeholder="Soyisim"><input type="tel" id="mtel" placeholder="Telefon"><input type="text" id="mshr" placeholder="Şehir"><button onclick="addMus()">Kaydet</button></div>`;
        m.forEach(([id,x]) => h += `<div class="item">${x.isim} ${x.soy}<br><small>📱 ${x.tel} | 🏙️ ${x.shr}</small><button class="item-del" onclick="del('mus','${id}')">Sil</button></div>`);
      }

      if(tab === 'sat') {
        h += `<button class="btn-add" onclick="document.getElementById('fsat').classList.toggle('hidden');">➕ Satış Ekle</button><div id="fsat" class="form hidden"><input type="text" id="smus" placeholder="Müşteri"><input type="number" id="ssat" placeholder="Satılan (kg)"><input type="number" id="ssip" placeholder="Sipariş (kg)"><input type="number" id="stah" placeholder="Tahsil (₺)"><button onclick="addSat()">Kaydet</button></div>`;
        s.forEach(([id,x]) => h += `<div class="item">${x.mus}<br><small>📦 ${x.sat}kg | 📋 ${x.sip}kg | 💵 ${x.tah}₺</small><button class="item-del" onclick="del('sat','${id}')">Sil</button></div>`);
      }

      if(tab === 'gid') {
        h += `<button class="btn-add" onclick="document.getElementById('fgid').classList.toggle('hidden');">➕ Gider Ekle</button><div id="fgid" class="form hidden"><select id="gkat"><option>Kategori</option><option>Elektrik</option><option>Su</option><option>Kira</option><option>Malzeme</option><option>Diğer</option></select><input type="text" id="gaç" placeholder="Açıklama"><input type="number" id="gtur" placeholder="Tutar (₺)"><button onclick="addGid()">Kaydet</button></div>`;
        g.forEach(([id,x]) => h += `<div class="item">${x.aç}<br><small>📂 ${x.kat} | 💰 ${x.tur}₺</small><button class="item-del" onclick="del('gid','${id}')">Sil</button></div>`);
      }

      h += `<button class="logout-btn" onclick="logout()">Çıkış</button></div>`;
      document.getElementById('app').innerHTML = h;
    }

    show();
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İş Yönetim</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px;margin:0;}
.header{background:#1e40af;color:white;padding:15px;text-align:center;border-radius:8px;margin-bottom:20px;}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:20px;}
.tab{padding:10px;background:white;border:2px solid #ddd;cursor:pointer;text-align:center;border-radius:4px;}
.tab.active{background:#1e40af;color:white;border-color:#1e40af;}
.container{max-width:600px;margin:0 auto;}
.stat{background:white;padding:15px;margin:10px 0;border-radius:4px;border-left:4px solid #1e40af;}
.form{background:white;padding:15px;margin:10px 0;border-radius:4px;}
input,select{width:100%;padding:8px;margin:5px 0;border:1px solid #ddd;border-radius:4px;font-size:14px;}
button{width:100%;padding:10px;margin:5px 0;background:#1e40af;color:white;border:none;border-radius:4px;cursor:pointer;}
.item{background:white;padding:10px;margin:5px 0;border-left:4px solid #0ea5e9;border-radius:4px;}
.del{background:#dc2626;float:right;}
.logout{background:#dc2626;margin-top:20px;}
.login{max-width:400px;margin:50px auto;background:white;padding:20px;border-radius:8px;}
.hidden{display:none;}
</style>
</head>
<body>
<div id="app"></div>
<script>
let users=JSON.parse(localStorage.getItem('users'))||{};
let current=localStorage.getItem('current');
let tab='dash';

function getData(){
return JSON.parse(localStorage.getItem('app_'+current))||{mus:{},sat:{},gid:{}};
}

function save(d){
localStorage.setItem('app_'+current,JSON.stringify(d));
show();
}

function showLogin(){
document.getElementById('app').innerHTML=`
<div class="login">
<h1 style="text-align:center;color:#1e40af;">📊 İş Yönetim</h1>
<div id="login">
<h2>Giriş</h2>
<input type="email" id="em" placeholder="Email">
<input type="password" id="pw" placeholder="Şifre">
<button onclick="login()">Giriş</button>
<button onclick="sig()" style="background:#059669;">Hesap Oluştur</button>
</div>
<div id="signup" class="hidden">
<h2>Hesap Oluştur</h2>
<input type="text" id="nm" placeholder="Adınız">
<input type="email" id="se" placeholder="Email">
<input type="password" id="sp" placeholder="Şifre">
<button onclick="signup()">Oluştur</button>
<button onclick="sig()" style="background:#666;">Geri</button>
</div>
</div>
`;
}

function sig(){
document.getElementById('login').classList.toggle('hidden');
document.getElementById('signup').classList.toggle('hidden');
}

function login(){
let e=document.getElementById('em').value;
let p=document.getElementById('pw').value;
if(users[e]&&users[e].pw===p){
localStorage.setItem('current',e);
current=e;
show();
}else alert('Hatalı!');
}

function signup(){
let n=document.getElementById('nm').value;
let e=document.getElementById('se').value;
let p=document.getElementById('sp').value;
if(!n||!e||!p){alert('Doldurun');return;}
if(users[e]){alert('Var');return;}
users[e]={nm:n,pw:p};
localStorage.setItem('users',JSON.stringify(users));
alert('Oldu!');
sig();
}

function addMus(){
let isim=document.getElementById('misim').value;
let soy=document.getElementById('msoy').value;
if(!isim||!soy){alert('Doldur');return;}
let d=getData();
d.mus['m'+Date.now()]={isim,soy,tel:document.getElementById('mtel').value,shr:document.getElementById('mshr').value};
save(d);
document.getElementById('misim').value='';
document.getElementById('msoy').value='';
}

function addSat(){
let mus=document.getElementById('smus').value;
if(!mus){alert('Müşteri');return;}
let d=getData();
d.sat['s'+Date.now()]={mus,sat:parseFloat(document.getElementById('ssat').value)||0,sip:parseFloat(document.getElementById('ssip').value)||0,tah:parseFloat(document.getElementById('stah').value)||0};
save(d);
document.getElementById('smus').value='';
}

function addGid(){
let kat=document.getElementById('gkat').value;
let aç=document.getElementById('gaç').value;
if(!kat||!aç){alert('Doldur');return;}
let d=getData();
d.gid['g'+Date.now()]={kat,aç,tur:parseFloat(document.getElementById('gtur').value)||0};
save(d);
document.getElementById('gkat').value='';
document.getElementById('gaç').value='';
}

function del(tip,id){
if(!confirm('Sil?'))return;
let d=getData();
delete d[tip][id];
save(d);
}

function logout(){
localStorage.removeItem('current');
current=null;
tab='dash';
showLogin();
}

function show(){
if(!current){showLogin();return;}
let d=getData();
let u=users[current];
let m=Object.entries(d.mus);
let s=Object.entries(d.sat);
let g=Object.entries(d.gid);
let tsat=s.reduce((a,b)=>a+(b[1].sat||0),0);
let tsip=s.reduce((a,b)=>a+(b[1].sip||0),0);
let ttah=s.reduce((a,b)=>a+(b[1].tah||0),0);
let tgid=g.reduce((a,b)=>a+(b[1].tur||0),0);

let h=`<div class="header"><h1>📊 İş Yönetim</h1><p>${u.nm}</p></div>`;
h+=`<div class="tabs"><div class="tab ${tab==='dash'?'active':''}" onclick="tab='dash';show();">📊</div><div class="tab ${tab==='mus'?'active':''}" onclick="tab='mus';show();">👥</div><div class="tab ${tab==='sat'?'active':''}" onclick="tab='sat';show();">📝</div><div class="tab ${tab==='gid'?'active':''}" onclick="tab='gid';show();">💰</div></div>`;
h+=`<div class="container">`;

if(tab==='dash'){
h+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
<div class="stat"><div style="font-size:12px;">📦 Satılan</div><div style="font-size:20px;font-weight:bold;color:#1e40af;">${tsat}</div></div>
<div class="stat"><div style="font-size:12px;">📋 Sipariş</div><div style="font-size:20px;font-weight:bold;color:#1e40af;">${tsip}</div></div>
<div class="stat"><div style="font-size:12px;">💵 Tahsil</div><div style="font-size:20px;font-weight:bold;color:#1e40af;">${ttah}</div></div>
<div class="stat"><div style="font-size:12px;">📊 Giderler</div><div style="font-size:20px;font-weight:bold;color:#1e40af;">${tgid}</div></div>
</div>`;
}

if(tab==='mus'){
h+=`<button onclick="document.getElementById('fmus').classList.toggle('hidden');">➕ Müşteri Ekle</button>
<div id="fmus" class="form hidden">
<input type="text" id="misim" placeholder="İsim">
<input type="text" id="msoy" placeholder="Soyisim">
<input type="tel" id="mtel" placeholder="Telefon">
<input type="text" id="mshr" placeholder="Şehir">
<button onclick="addMus()">Kaydet</button>
</div>`;
m.forEach(([id,x])=>h+=`<div class="item">${x.isim} ${x.soy}<br><small>📱 ${x.tel} | 🏙️ ${x.shr}</small><button class="del" onclick="del('mus','${id}')">Sil</button></div>`);
}

if(tab==='sat'){
h+=`<button onclick="document.getElementById('fsat').classList.toggle('hidden');">➕ Satış Ekle</button>
<div id="fsat" class="form hidden">
<input type="text" id="smus" placeholder="Müşteri">
<input type="number" id="ssat" placeholder="Satılan (kg)">
<input type="number" id="ssip" placeholder="Sipariş (kg)">
<input type="number" id="stah" placeholder="Tahsil (₺)">
<button onclick="addSat()">Kaydet</button>
</div>`;
s.forEach(([id,x])=>h+=`<div class="item">${x.mus}<br><small>📦 ${x.sat}kg | 📋 ${x.sip}kg | 💵 ${x.tah}₺</small><button class="del" onclick="del('sat','${id}')">Sil</button></div>`);
}

if(tab==='gid'){
h+=`<button onclick="document.getElementById('fgid').classList.toggle('hidden');">➕ Gider Ekle</button>
<div id="fgid" class="form hidden">
<select id="gkat">
<option>Kategori</option>
<option>Elektrik</option>
<option>Su</option>
<option>Kira</option>
<option>Malzeme</option>
<option>Diğer</option>
</select>
<input type="text" id="gaç" placeholder="Açıklama">
<input type="number" id="gtur" placeholder="Tutar (₺)">
<button onclick="addGid()">Kaydet</button>
</div>`;
g.forEach(([id,x])=>h+=`<div class="item">${x.aç}<br><small>📂 ${x.kat} | 💰 ${x.tur}₺</small><button class="del" onclick="del('gid','${id}')">Sil</button></div>`);
}

h+=`<button class="logout" onclick="logout()">Çıkış</button></div>`;
document.getElementById('app').innerHTML=h;
}

show();
</script>
</body>
</html>
